services:
  app:
    build: .
    ports: ["5000:5000"]
    env_file: .env          # JWT_SECRET_KEY must be a real 32+ char secret in production
    environment:
      DATABASE_PATH: /app/data/stock_dashboard.db
    volumes:
      - stock-data:/app/data
    restart: unless-stopped
volumes:
  stock-data:
